name: windows-package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the MSI to (created if missing)"
        required: true
        default: "0.2.2"
  release:
    types: [published]

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-sqlite3

      - name: WiX 3
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "wix3") -Force

      - name: Package
        shell: pwsh
        run: |
          $msys = "${{ steps.msys2.outputs.msys2-location }}"
          $ucrt = Join-Path $msys "ucrt64\bin"
          $wix  = Join-Path $env:RUNNER_TEMP "wix3"
          $env:CMAKE_PREFIX_PATH = Join-Path $msys "ucrt64"
          & .\packaging\package-win.ps1 -WixDir $wix -ToolchainBin $ucrt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload MSI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          FILE=$(ls build-msi/PepeNet-*.msi | head -1)
          WEB=$(ls build-msi/pepenet-web.exe | head -1)
          OUT="Windows-PepeNet-${TAG}.msi"
          cp "$FILE" "$OUT"
          echo "asset $OUT -> $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "PepeNet $TAG" \
              --notes "Windows MSI (pepenet.exe + pepenet-web.exe)."
          fi
          gh release upload "$TAG" "$OUT" --clobber
          if [ -n "$WEB" ]; then
            gh release upload "$TAG" "$WEB" --clobber
          fi
