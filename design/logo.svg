<?xml version='1.0' encoding='UTF-8'?>
<!--
  PepeNet mark — the Pepecoin "P with a stroke" over a white globe on a green
  badge. Vector recreation of design/pepenetlogo.png (1024x1024 raster).

  THIS IS THE SOURCE OF TRUTH for the inline copy compiled into the fail-closed
  error pages: PN_LOGO / PN_P in src/proxy.c. Keep the two in step. The inline
  copy differs only where the embedding demands it:
    - no xmlns (not needed for inline SVG in an HTML document)
    - no <title>; it carries class='lg' aria-hidden='true' instead, because on
      the error page the mark is decorative and the wordmark beside it is the
      accessible name
    - width/height 44
  Every attribute value is SINGLE-quoted, deliberately: the inline copy lives in
  a C string literal (so double quotes would need escaping), and unquoted values
  make the HTML parser silently drop the enclosing <g> — which is how the globe
  disappeared the first time.

  Colours are sampled from the raster, not eyeballed:
    - badge  #6cb274 -> #429856 -> #368b4c, three stops because the measured
      midpoint is noticeably darker than a linear ramp between the ends
    - white  #ffffff -> #dcddd9, shared by the globe AND the P (the rim measures
      255 at top / 223 at bottom, the P 251 / 223 — the same ramp). Sampling
      across x showed no trend, so it is a true vertical.

  The P is edged in the badge's own green rather than drop-shadowed, so it reads
  against the globe without a shadow muddying the glyph at small sizes.
-->
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'
     width='512' height='512' role='img' aria-label='PepeNet'>
  <title>PepeNet</title>

  <defs>
    <!-- the badge; objectBoundingBox on a circle that spans the whole viewBox -->
    <linearGradient id='pnG' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#6cb274'/>
      <stop offset='.5' stop-color='#429856'/>
      <stop offset='1' stop-color='#368b4c'/>
    </linearGradient>

    <!-- the white ramp, in user space so ONE gradient spans the whole badge
         rather than restarting per element -->
    <linearGradient id='pnW' gradientUnits='userSpaceOnUse' x1='0' y1='0' x2='0' y2='64'>
      <stop offset='0' stop-color='#ffffff'/>
      <stop offset='1' stop-color='#dcddd9'/>
    </linearGradient>

    <!-- The two ramps the P uses. Both inherit their stops via href and add
         gradientTransform='rotate(-9.8 ...)' to cancel the glyph group's
         rotation: without it the ramps would tilt with the letter instead of
         staying vertical, and the green edge would stop matching the badge
         behind it — which is the entire point of the edge. -->
    <linearGradient id='pnWp' href='#pnW' gradientTransform='rotate(-9.8 32 32)'/>
    <linearGradient id='pnGu' href='#pnG' gradientUnits='userSpaceOnUse'
                    x1='0' y1='0' x2='0' y2='64'
                    gradientTransform='rotate(-9.8 32 32)'/>
  </defs>

  <!-- the badge -->
  <circle cx='32' cy='32' r='32' fill='url(#pnG)'/>

  <!-- the globe: rim, one meridian ellipse, the axes, and two curved parallels -->
  <g fill='none' stroke='url(#pnW)' stroke-width='2.15'>
    <circle cx='32' cy='32' r='27.6'/>
    <ellipse cx='32' cy='32' rx='16' ry='27.6'/>
    <path d='M32 4.4v55.2M4.4 32h55.2M11.2 13.8Q32 25.4 52.8 13.8M11.2 50.2Q32 38.6 52.8 50.2'/>
  </g>

  <!-- The P, tilted, edged in the badge green. paint-order='stroke' draws the
       edge first so the fill covers its inner half and the glyph keeps its
       weight; miter + a raised miterlimit keep every corner sharp (the default
       limit of 4 quietly bevels the tightest angles into chamfers). -->
  <g transform='rotate(9.8 32 32)'>
    <path d='M21.1 17.1h19.4c4.8 0 7.4 4.8 7.4 10.9s-2.6 10.9-7.4 10.9H28.1v13.35h-7V30.4h-3.6v-4.4h3.6zm7 5.8v3.1h6.3v4.4h-6.3v2.5h7.9c3 0 4.3-2.2 4.3-5s-1.3-5-4.3-5z'
          fill='url(#pnWp)' stroke='url(#pnGu)' stroke-width='4'
          stroke-linejoin='miter' stroke-miterlimit='12' paint-order='stroke'/>
  </g>
</svg>
